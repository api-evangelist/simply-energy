actions:
  openapiPaths:
  - openapi/simply-energy-cds-energy-openapi.yml
  - openapi/simply-energy-cds-common-openapi.yml
  apisYmlUpdated: true
  reason: |
    Bootstrapped the Simply Energy provider profile around a CDR energy mandate that
    was verified as implemented rather than merely claimed, recorded the April 2024
    rebrand to ENGIE that moved the obligation to a different brand name, listed the
    two confirmed-live public surfaces plus the accredited-only consumer data surface,
    and harvested the shared Consumer Data Standards energy and common contracts. No
    proprietary specification and no developer portal exist to harvest.
