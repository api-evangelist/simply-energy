description: |
  Entity-relationship graph derived from the two harvested Consumer Data Standards contracts -
  schema $ref links plus id-reference fields (accountId, servicePointId, planId). This is the
  shared CDR energy data model every Australian energy data holder implements; nothing here is
  proprietary to this retailer.
id_permanence_note: |
  Per the CDS ID Permanence standard, accountId and servicePointId are arbitrary, meaningless,
  immutable-per-consent identifiers that are NOT transferable across data recipient software
  products. planId on the public generic-tariff surface is the exception - it is a stable
  public identifier, observed in the form ENG1145433MRE1@EME.
