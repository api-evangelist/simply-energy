    description: >-
      CONFIRMED LIVE 2026-07-27. Public, unauthenticated CDR generic tariff data, hosted on the
      retailer's behalf by the Australian Energy Regulator's Energy Made Easy service. Serves
      /energy/plans (x-v 1) and /energy/plans/{planId} (x-v 3) only.
    x-gate: public
    x-verified: '2026-07-27'
  - url: https://public.cdr.engie.com.au/cds-au/v1
    description: >-
      CONFIRMED LIVE 2026-07-27. The brand's own registered CDR Public Base URI. Serves the CDS
      Common discovery endpoints only; returns nginx HTTP 404 for /energy/plans.
    x-gate: public
    x-verified: '2026-07-27'
  - url: https://mtls.dh.example.com/cds-au/v1
    description: >-
      Data Standards Body PLACEHOLDER host from the shared specification. Not a real endpoint.
      The retailer's real MTLS resource base URI is published only through the authenticated
