provider_published: false
format: cds-error-list
format_note: |
  NOT RFC 9457. The Consumer Data Standards define their own error envelope. Responses use
  application/json (never application/problem+json) and carry a top-level `errors` array of
  objects with `code`, `title`, `detail` and optional `meta`. The `code` is a URN in the
  namespace urn:au-cds:error:cds-all: (cross-industry), urn:au-cds:error:cds-energy:
  (energy-specific) or urn:au-cds:error:cds-banking: (not applicable here).
envelope:
  media_type: application/json
  schema: ResponseErrorListV2 / PrimaryResponseErrorListV1
  shape:
    errors:
    - code: URN string identifying the error class
      title: Short human-readable title
      detail: Contextual detail - usually the offending field, header or resource id
      meta: Optional object with additional error metadata
