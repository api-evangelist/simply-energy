  Simply Energy / ENGIE publishes NO client library in any registry. Searched npm, PyPI, and
  the provider's own surface on 2026-07-27; there is no developer portal, no SDK page and no
  attributable GitHub organisation (github.com/SimplyEnergy and github.com/Simply-Energy exist
