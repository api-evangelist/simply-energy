  github.com/engie-group is ENGIE SA's global organisation, not an Australian retail API
  surface). No `SDKs` pointer is wired for this provider, because none of the packages below
  are first-party.

  What DOES exist is a small ecosystem of Consumer Data Standards libraries that a developer
  integrating with any Australian CDR energy data holder - including this one - would actually
  reach for. They are recorded as ecosystem packages with official: false.
