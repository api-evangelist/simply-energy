note: |
  No /.well-known/ document was recoverable on any host in this provider's surface. This is
  recorded as a negative result, not an omission. Two distinct causes were observed:

  (1) The two live CDR hosts (public.cdr.engie.com.au, cdr.energymadeeasy.gov.au) return a
      clean HTTP 404 for every probed path. Consumer Data Right data holders publish their
      OpenID Provider Configuration through the AUTHENTICATED portion of the CDR Register,
      reachable only by an ACCC-accredited data recipient presenting a CDR client
      certificate, so an anonymous /.well-known/openid-configuration is expected to be
      absent by design.
  (2) The two corporate web hosts (engie.com.au, www.simplyenergy.com.au) sit behind
      Cloudflare and return HTTP 403 to every automated fetcher, so absence there is
      unproven rather than confirmed.

  The OpenAPI servers[] host, https://mtls.dh.example.com, is the Data Standards Body
  placeholder host from the shared specification and is not a real endpoint; it was not
  probed.
  A single 200 WAS recovered, but on the ultimate parent group's host (www.engie.com, ENGIE SA,
  France) rather than on any Australian retail or CDR host. It is recorded with that scope
  stated explicitly so it is never read as an Australian retail-entity publication.
