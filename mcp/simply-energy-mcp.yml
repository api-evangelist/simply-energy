accredited_gate_note: |
  Every tool in candidate_tools_accredited_only requires ACCC accreditation as a data
  recipient, a CDR client certificate, a software product registered on the CDR Register,
  the CDR FAPI 1.0 Advanced security profile (OAuth2/OIDC + PAR + PKCE + MTLS), and an
  explicit, scoped, time-limited consumer consent. There is no self-serve key and no sandbox
  tier. An MCP server exposing these tools would have to carry the consent artefact as part of
  its session state, not just a bearer token. See agentic-access/simply-energy-agentic-access.yml.
