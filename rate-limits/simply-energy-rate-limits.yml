provider_published: false
provenance_note: |
  This retailer publishes no rate-limit page of its own. The traffic thresholds below are
  normative Consumer Data Standards Non-Functional Requirements and are binding on it as a
  designated CDR energy data holder (provider number DH002028). Calls in excess of these
  thresholds may be freely throttled or rejected by the data holder without breaching its
  performance or availability obligations.
signaling:
  header: Retry-After
  detail: Retry-After is exposed on the live public endpoints via
    access-control-expose-headers, observed 2026-07-27. No X-RateLimit-* family is defined.
