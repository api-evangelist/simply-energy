- {param: page-size, max: 1000, default: 25, error: 'urn:au-cds:error:cds-all:Field/InvalidPageSize'}
notes:
- Unattended traffic during high traffic periods receives best-effort support only.
- Data recipients are expected to cache low-velocity data sets (generic tariff data is
  explicitly low velocity) rather than re-requesting unchanged resources.
- No thresholds apply to secondary data holders, because their traffic is already shaped by
  the primary data holder thresholds.
