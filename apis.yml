name: Simply Energy
kind: company
description: Simply Energy is the former brand of the Australian electricity and gas retailer
  that now trades as ENGIE, operated by IPower Pty Ltd (ACN 111 267 228) and IPower 2 Pty
  Ltd (ABN 24 070 374 293) trading as ENGIE (ABN 67 269 241 237), together with Simply Energy
  Solutions Pty Ltd. The business carried the Simply Energy name for seventeen years before
  rebranding to ENGIE in April 2024, and supplies more than 700,000 residential and business
  accounts across Victoria, South Australia, New South Wales, Queensland and Western Australia.
  It sits on the retail tier of the National Electricity Market value chain, buying wholesale
  energy and billing end customers, rather than in generation, transmission or distribution.
  Its API posture is entirely a product of statutory mandate, and in this case the mandate
  is genuinely implemented rather than merely claimed. The company is a designated Consumer
  Data Right energy data holder (data holder provider number DH002028) and is listed on the
  live CDR Register under the ENGIE brand. Its unauthenticated CDR Generic Plans endpoint,
  hosted for it by the Australian Energy Regulator's Energy Made Easy service, returns 2,452
  real ENGIE tariff plans conforming to the Consumer Data Standards energy schemas, and its
  own registered public base URI serves the Consumer Data Standards discovery endpoints with
  correct x-v version negotiation. Everything else is closed. Customer usage, billing, service
  point and DER data are available only to ACCC accredited data recipients with explicit consumer
  consent, there is no developer portal, no self-serve API keys, no published OpenID Connect
  discovery document, and no open grid, market or system data of any kind.
