- aid: simply-energy:simply-energy-cdr-energy-consumer-data-api
  name: Simply Energy (ENGIE) CDR Energy Consumer Data API
  description: The mandated Consumer Data Right consumer data sharing surface, covering energy
    accounts, balances, billing, invoices, concessions, payment schedules, electricity service
    points, usage and distributed energy resources, conforming to the shared Consumer Data
    Standards energy contract. NOT anonymously verifiable and deliberately listed without
    a base URL. The CDR InfoSec and resource base URIs for a data holder are published only
    through the authenticated portion of the CDR Register and are reachable only by an ACCC
    accredited data recipient presenting a client certificate. Access requires ACCC accreditation,
    OAuth2 / OpenID Connect under the CDR FAPI profile, mutual TLS, and explicit consumer
    consent. Recorded here as designated and documented, not as an endpoint confirmed by API
    Evangelist.
  humanURL: https://engie.com.au/help-centre/cdr-policy
