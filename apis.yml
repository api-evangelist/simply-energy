apis:
- aid: simply-energy:simply-energy-cdr-energy-generic-plans-api
  name: Simply Energy (ENGIE) CDR Energy Generic Plans API
  description: Public, unauthenticated Consumer Data Right Generic Tariff Data for the Simply
    Energy / ENGIE retail brand, conforming to the Data Standards Body Consumer Data Standards
    energy schemas. Confirmed live on 2026-07-27. GET /energy/plans returns HTTP 200 with
    x-v 1 and meta.totalRecords 2452 ENGIE electricity and gas plans (MARKET and STANDING)
    across Ausgrid, Endeavour, Essential Energy, Energex, SA Power Networks, Jemena and AGN
    distribution zones. GET /energy/plans/{planId} returns HTTP 200 at x-v 3. The endpoint
    is hosted on behalf of the retailer by the Australian Energy Regulator's Energy Made Easy
    service; it is not self-hosted.
  humanURL: https://engie.com.au/help-centre/cdr-policy
  baseURL: https://cdr.energymadeeasy.gov.au/engie/cds-au/v1
  tags:
  - Energy Plans
  - Generic Tariff Data
  - Consumer Data Right
  - Public
