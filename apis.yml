- aid: simply-energy:simply-energy-cdr-discovery-api
  name: Simply Energy (ENGIE) CDR Discovery API
  description: The Consumer Data Standards Common Discovery API served from the brand's own
    registered CDR Public Base URI. Confirmed live on 2026-07-27. GET /discovery/status returns
    HTTP 200 at x-v 1 with status OK, and GET /discovery/outages returns HTTP 200 at x-v 1
    with an empty outages array. Both correctly reject x-v 2 and above with urn:au-cds:error:cds-all:Header/UnsupportedVersion.
    This host does NOT serve /energy/plans, it returns an nginx HTTP 404, which matches the
    behaviour of AGL, Alinta and Origin Energy and reflects the CDR energy design in which
    generic tariff data is centralised at the Australian Energy Regulator rather than held
    by each retailer.
  humanURL: https://engie.com.au/help-centre/cdr-policy
  baseURL: https://public.cdr.engie.com.au/cds-au/v1
  tags:
  - Discovery
  - Status
